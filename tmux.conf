# ~/.config/tmux/tmux.conf for tmux 3.8
# Made with https://tmux.app/config-generator/
# Edit this config: https://tmux.app/config-generator/#file=xdg&defs=comment&keys=vi&vsel=1&clip=osc52&split=pipes&nav=vim&resize=1&spos=top&sstyle=dark&sint=15&extk=1&titles=1&activity=1&sbar=auto-hide&lnum=1&pl=sensible.resurrect.continuum.yank&pth=dracula
# Apply changes: tmux source-file ~/.config/tmux/tmux.conf  (or Prefix + r)

# ── General ───────────────────────────────────────────────────────────
# Mouse: click to select panes and windows, drag borders to resize, wheel scrolls
# Already the default on tmux 3.8:
# set -g mouse on
# Number windows and panes from 1, so the first window is Prefix + 1
set -g base-index 1
setw -g pane-base-index 1
# Renumber windows when one is closed (no gaps such as 1 2 4)
set -g renumber-windows on
# Lines of scrollback kept per pane (applies to panes created after this is set)
set -g history-limit 50000
# Wait only 10 ms after Esc, so Vim and Neovim react at once
# Already the default on tmux 3.8 (it was 500 before 3.5):
# set -s escape-time 10
# Show messages for 2 seconds instead of 0.75
set -g display-time 2000
# Pass focus events to programs (Vim autoread, editors that save on blur)
set -s focus-events on
# Set the terminal window title to session and window name
set -g set-titles on
set -g set-titles-string "#S / #W"
# Mark windows with new output in the status line
setw -g monitor-activity on
# Prefix + r reloads this file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# ── Copy mode and clipboard ───────────────────────────────────────────
# vi keys in copy mode (h/j/k/l, /, ?, w, b ...)
setw -g mode-keys vi
# Vim-like selection: v starts, Ctrl+v toggles block mode, y copies and exits
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# Let programs inside tmux (Neovim, ssh sessions) set the clipboard with OSC 52,
# and send copies to your terminal's clipboard
set -s set-clipboard on
# Line numbers in copy mode (new in tmux 3.7)
setw -g copy-mode-line-numbers absolute
# Scrollbar on the right of each pane, hidden until you scroll or hover
setw -g pane-scrollbars auto-hide

# ── Panes and windows ─────────────────────────────────────────────────
# Prefix + | splits left/right and Prefix + - splits top/bottom, in the current directory
# (- replaces the default delete-buffer key; % and " keep working)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# New windows open in the current directory too
bind c new-window -c "#{pane_current_path}"
# Prefix + h/j/k/l moves between panes like Vim
# (l replaces last-window; Prefix + ; still goes to the last pane)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Prefix + H/J/K/L resizes the pane by 5 cells; hold the letter to repeat
# (L replaces switch-client -l)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Status line ───────────────────────────────────────────────────────
# Status line at the top of the screen
set -g status-position top

# ── Colors and terminal ───────────────────────────────────────────────
# tmux 3.8 picks a light or dark theme from your terminal's background
# Already the default:
# set -s theme detect
# TERM inside tmux: italics and 256 colors
# Already the default when the tmux-256color terminfo entry exists:
# set -g default-terminal "tmux-256color"
# 24-bit true color when the outer terminal's TERM is xterm-256color (3.6+ also detects COLORTERM=truecolor)
set -as terminal-features ",xterm-256color:RGB"
# Extended keys, so programs can tell Ctrl+Shift and Ctrl+Enter apart
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# ── Plugins (TPM) ─────────────────────────────────────────────────────
# Plugins, managed by TPM. After the first start press Prefix + I (capital i)
# to install them; Prefix + U updates them
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
# Restore the last saved environment when the tmux server starts
set -g @continuum-restore 'on'
# Dracula status line theme
set -g @plugin 'dracula/tmux'
# Install TPM and the plugins automatically the first time tmux starts
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
# Keep this line at the very bottom of the file
run '~/.config/tmux/plugins/tpm/tpm'
